    {
      "claim_id": "PROPOSAL-02-01",
      "text": "工资到账后，余额可能同时承担房租、账单、生活准备金、应急和长期目标。把它们合并为一个可投资数字，会丢失截止时间、已确认用途和资产流动性。系统要回答的是某笔动作能否在每个保护时点维持现金覆盖。",
      "type": "设计",
      "source_refs": [
        "S01",
        "S02",
