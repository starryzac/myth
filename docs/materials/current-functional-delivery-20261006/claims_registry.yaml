    },
    {
      "claim_id": "PROPOSAL-02-02",
      "text": "已到账收入有原流水与来源；下个月工资只是未来展示。产品本金可能尚未可用，目标归属也不能被一般资金缺口任意借走。缺事实、缺条款或缺授权时显示UNKNOWN，不能补零。",
