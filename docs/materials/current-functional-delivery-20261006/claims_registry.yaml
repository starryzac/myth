    {
      "claim_id": "PROPOSAL-03-01",
      "text": "手工预算依赖逐次选择；余额阈值只观察一个时点。它们可作为实验基线，但不能凭定义认定其不安全，也不能把共同安全网关拒绝的候选算成真实资金违规。",
