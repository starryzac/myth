schema_version: 1
scope: W0 changed-files selection; plans only, never executes tests or closes tasks.
sources:
- docs/spec/verification-map.md
- docs/progress/evidence/W0/verification-pg/manifest.json
evidence_boundary: Original PG batch collected 26 parametrized cases before the seventh historical-read
  test was added. Function node selectors below include current source and are not PASS evidence.
stage_order:
- quick_static
- quick_pure
- integration_pg
- benchmark
execution_rules:
- Stop dependent checks after quick failure.
- Independent quick nodes may run concurrently.
- Single funds chain and PG ownership remain sequential; use disposable isolated PG.
- No default full-suite execution; whole checks remain MVP/FULL acceptance nodes.
- A selection is not execution, and unrecognized scope cannot be GREEN.
test_sets:
  audit_pure:
  - apps/api/app/tests/test_audit_subject_encoding.py
  - apps/api/app/tests/test_audit_chain_domain.py
  request_pg:
  - apps/api/app/tests/test_historical_read.py::test_one_rr_readonly_scope_verifies_once_and_separate_scope_verifies_again
  - apps/api/app/tests/test_historical_read.py::test_read_committed_and_write_transactions_never_reuse_ledger_verification
  - apps/api/app/tests/test_historical_read.py::test_pending_new_dirty_and_deleted_objects_invalidate_reuse_without_flushing
  - apps/api/app/tests/test_historical_read.py::test_session_transaction_and_nested_boundaries_never_reuse_another_snapshot
  - apps/api/app/tests/test_historical_read.py::test_exception_closes_scope_and_cannot_leave_a_verified_request_context
  - apps/api/app/tests/test_historical_read.py::test_next_request_rejects_nonhead_tampering_even_when_all_ledger_heads_are_unchanged
  - apps/api/app/tests/test_historical_read.py::test_in_place_nonhead_metadata_mutation_invalidates_same_request_ledger_result
  - apps/api/app/tests/test_decision_readonly_transaction.py::test_history_and_receipt_gets_are_readonly_before_the_first_user_select
  - apps/api/app/tests/test_decision_readonly_transaction.py::test_history_errors_discard_previous_success_and_never_repair_or_make_commands_readonly
  - apps/api/app/tests/test_decision_trace_audit.py::test_public_original_decision_and_explanation_are_readonly
  - apps/api/app/tests/test_decision_trace_audit.py::test_original_source_rehash_cannot_rewrite_recorded_decision
  - apps/api/app/tests/test_decision_trace_audit.py::test_cross_user_history_is_404_and_does_not_touch_any_business_table
  - apps/api/app/tests/test_decision_trace_audit.py::test_legal_source_supersession_keeps_frozen_trace_and_explanation
  - apps/api/app/tests/test_decision_trace_audit.py::test_constraint_projection_corruption_is_rejected_without_repair
  - apps/api/app/tests/test_decision_trace_audit.py::test_receipt_links_all_fresh_phases_and_keeps_original_ask_source
  - apps/api/app/tests/test_decision_trace_audit.py::test_t1_history_get_preserves_waiting_cash_and_does_not_settle_revoked_action
  - apps/api/app/tests/test_decision_trace_audit.py::test_unknown_lost_response_keeps_original_committed_bank_trace_on_retry
  - apps/api/app/tests/test_execution_receipt_integrity.py::test_completed_receipt_read_and_replay_reject_tampered_bank_evidence
  - apps/api/app/tests/test_recovery_receipt_integrity.py::test_unflushed_immutable_bank_objects_are_checked_without_autoflush
  - apps/api/app/tests/test_audit_storage.py::test_open_missing_original_fails_but_lifecycle_and_sealed_reset_remain_valid
  - apps/api/app/tests/test_audit_storage.py::test_verification_refuses_budget_before_loading_original_text
  - apps/api/app/tests/test_audit_api.py::test_audit_verify_uses_real_repeatable_read_and_read_only_transaction
  - apps/api/app/tests/test_execution_api.py::test_http_preparation_confirmation_execution_and_receipt_roundtrip
  storage_negatives:
  - apps/api/app/tests/test_audit_storage.py::test_first_epoch_has_real_genesis_and_repeat_is_readonly
  - apps/api/app/tests/test_audit_storage.py::test_sql_insert_cannot_omit_hashed_required_tenant_header
  - apps/api/app/tests/test_audit_storage.py::test_ordinary_owner_dml_cannot_rewrite_or_remove_history
  - apps/api/app/tests/test_audit_storage.py::test_reading_absent_chain_is_unaudited_and_has_no_writes
  - apps/api/app/tests/test_audit_storage.py::test_real_nonowner_role_cannot_bypass_append_only_triggers
  - apps/api/app/tests/test_audit_storage.py::test_retry_checks_actual_stored_columns_and_never_repairs_them
  - apps/api/app/tests/test_audit_storage.py::test_verification_refuses_budget_before_loading_original_text
  - apps/api/app/tests/test_audit_storage.py::test_open_missing_original_fails_but_lifecycle_and_sealed_reset_remain_valid
  quality_pure:
  - apps/api/app/tests/test_task_orchestration.py
  benchmark_pure:
  - apps/api/app/tests/test_benchmark_reads.py
  selector_pure:
  - apps/api/app/tests/test_verification_selection.py
  critical_financial_pg:
  - apps/api/app/tests/test_execution_api.py::test_http_preparation_confirmation_execution_and_receipt_roundtrip
  - apps/api/app/tests/test_execution_receipt_integrity.py::test_completed_receipt_read_and_replay_reject_tampered_bank_evidence
  - apps/api/app/tests/test_policy_execution_lifecycle.py
  - apps/api/app/tests/test_execution_context.py
  - apps/api/app/tests/test_external_bank_pending_reconciliation.py
  critical_financial_pure:
  - apps/api/app/tests/test_boundary_properties.py
  - apps/api/app/tests/test_goal_allocation_properties.py
  - apps/api/app/tests/test_recovery_properties.py
rules:
- id: request_read_integrity
  patterns:
  - apps/api/app/services/audit_chain.py
  - apps/api/app/services/historical_read.py
  - apps/api/app/services/decision_trace.py
  - apps/api/app/services/action_contracts.py
  - apps/api/app/services/execution_projection.py
  - apps/api/app/services/recovery_receipt_integrity.py
  - apps/api/app/services/simulated_bank.py
  - apps/api/app/services/dashboard_helpers.py
  reason: Request-local query/original normalization/ledger reuse touches original-source and receipt
    consumers; preserve tenant/RR/READ ONLY/no-write, UNKNOWN/T1 and actual money POST.
  quick_pure:
  - audit_pure
  integration_pg:
  - request_pg
  - storage_negatives
  uncovered:
  - Browser presentation not selected unless UI/DTO changes.
  - Formal old history is preserved separately by before/after read-only snapshots.
  - Parameterized selectors run all parameters; selector count is not actual collected/pass count.
- id: history_tests
  patterns:
  - apps/api/app/tests/test_historical_read.py
  - apps/api/app/tests/test_audit*.py
  - apps/api/app/tests/test_decision*readonly*.py
  - apps/api/app/tests/test_decision_trace_audit.py
  - apps/api/app/tests/test_execution_receipt_integrity.py
  - apps/api/app/tests/test_recovery_receipt_integrity.py
  reason: These tests protect invocation and original receipt integrity; select direct test plus real
    request consumers.
  quick_pure:
  - audit_pure
  integration_pg:
  - request_pg
  - storage_negatives
  uncovered:
  - Test edits do not authorize weakening/deleting original tamper/absence/truncation negatives.
- id: quality_orchestration
  patterns:
  - scripts/tasks.py
  - scripts/generate_openapi.py
  - apps/api/app/tests/test_task_orchestration.py
  - Makefile
  - make.cmd
  reason: Mypy/contract command de-duplication preserves every distinct gate and standalone OpenAPI behavior.
  quick_pure:
  - quality_pure
  integration_pg: []
  uncovered:
  - No financial integration triggered by orchestration-only behavior.
  - Generated contracts must be regenerated and Web typechecked if their bytes/API semantics change.
- id: benchmark
  patterns:
  - scripts/benchmark_reads.py
  - apps/api/app/tests/test_benchmark_reads.py
  reason: Benchmark fixture, counters, fingerprint, identical data and safe disposable DB naming must
    remain truthful.
  quick_pure:
  - benchmark_pure
  integration_pg: []
  benchmark:
  - 'Same source/data: short-seeded, mvp401-long-chain, expanded-fixed-history; baseline and candidate
    wall-clock passes separated from counters/profile.'
  uncovered:
  - Helper PASS does not prove measured performance.
  - Run benchmark only after quick checks and required PG integrity PASS; no formal DB reset.
- id: selection_map
  patterns:
  - scripts/select_verification.py
  - docs/spec/verification-map.yaml
  - apps/api/app/tests/test_verification_selection.py
  reason: Selector must preserve exact nodes, de-duplicate and expose unrecognized financial scope.
  quick_pure:
  - selector_pure
  integration_pg: []
  uncovered:
  - Selection tool never runs PG or certifies tests.
- id: scope_docs
  patterns:
  - docs/**/*.md
  - docs/**/*.yaml
  - docs/**/*.json
  - docs/**/*.log
  - docs/**/*.gz
  - '*.md'
  - scripts/verify_full_delta_map.py
  reason: Documentation/mapping-only changes use source fidelity/path/partition checks and existing financial
    evidence.
  quick_pure: []
  integration_pg: []
  checks:
  - - python
    - scripts/verify_full_delta_map.py
  uncovered:
  - Review changed documentation links/claims.
  - Existing evidence cannot be rewritten into success; new evidence needs original command/exit/source/data
    metadata.
  - No claim of human study or unmeasured performance.
unknown_financial_prefixes:
- apps/api/app/
- apps/api/app/services/
- apps/api/app/domain/
- apps/api/app/db/
- apps/api/app/api/
- apps/api/alembic/
unknown_financial_policy:
  status: NEEDS_SCOPE_REVIEW
  quick_pure:
  - critical_financial_pure
  integration_pg:
  - critical_financial_pg
  uncovered:
  - 'Unrecognized financial path: conservative consumers selected, but direct module/codec/migration/browser
    impacts require explicit review; never silently GREEN.'
unknown_other_policy:
  status: NEEDS_SCOPE_REVIEW
  uncovered:
  - Path is outside current W0 mapping; add a specific dependency rule and direct checks before treating
    selection as complete.
