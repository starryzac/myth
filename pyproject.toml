[project]
name = "bounded-funds"
version = "0.1.0"
description = "Auditable simulated bounded funds agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "hypothesis>=6.112,<7",
  "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.13,<2", "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/app/tests"]
addopts = "-ra --strict-markers"
markers = ["property: generated invariant scenarios", "integration: database integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api"
files = ["apps/api/app"]

[tool.coverage.run]
source = ["apps/api/app"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
