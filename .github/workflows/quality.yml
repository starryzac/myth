name: BoundedFunds quality commands

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'packages/contracts/**'
      - '*.toml'
      - '*lock*'
      - '.github/workflows/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      quality_target:
        type: choice
        description: 'Explicit acceptance command; native tests need an isolated configured worker'
        default: static
        options:
          - static
          - unit
          - property
          - integration
          - e2e
          - security-check
          - audit-verify
          - evidence-check
          - build-proposal
          - full-check
      evidence_request:
        type: string
        description: 'Explicit existing original request on isolated worker; missing input fails'
        required: false
      final_context:
        type: string
        description: 'Existing current-source acceptance context on isolated worker'
        required: false

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - run: uv sync --locked --dev
      - run: pnpm install --frozen-lockfile
      - name: Actual lint command
        run: python scripts/tasks.py lint
      - name: Actual type/contract command
        run: python scripts/tasks.py typecheck
      - name: Actual production security rules
        run: python scripts/tasks.py security-check

  explicit-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.quality_target != 'static'
    needs: static
    # This dedicated label must be provisioned outside this file. No hosted Linux job
    # is represented as native Edge/video/offline acceptance, and no secret is generated here.
    runs-on: [self-hosted, Windows, bounded-funds-isolated-acceptance]
    concurrency:
      group: bounded-funds-single-financial-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      QUALITY_TARGET: ${{ inputs.quality_target }}
      BOUNDEDFUNDS_EVIDENCE_REQUEST: ${{ inputs.evidence_request }}
      BOUNDEDFUNDS_FINAL_CONTEXT: ${{ inputs.final_context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false # Preserve original evidence on this dedicated workspace.
      - name: Actual selected command; failure stops this job
        run: |
          python scripts/tasks.py $env:QUALITY_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
